services:
  cvat_server:
    environment:
      CVAT_ENABLE_S3_API_STORAGE: "true"

      # === MinIO endpoint ===
      CVAT_S3_ENDPOINT_URL: "${MINIO_ENDPOINT_URL:-http://minio:9000}"
      CVAT_S3_REGION: "${MINIO_REGION:-us-east-1}"
      CVAT_S3_USE_HTTPS: "${MINIO_USE_HTTPS:-false}"

      # === MinIO creds ===
      CVAT_S3_ACCESS_KEY_ID: "${MINIO_ACCESS_KEY}"
      CVAT_S3_SECRET_ACCESS_KEY: "${MINIO_SECRET_KEY}"

      # === Buckets ===
      CVAT_S3_DATA_BUCKET: "${CVAT_DATA_BUCKET:-cvat-data}"
      CVAT_S3_ANNOTATIONS_BUCKET: "${CVAT_ANNOTATIONS_BUCKET:-cvat-exports}"

    depends_on:
      cvat_db:
        condition: service_started
      cvat_redis_inmem:
        condition: service_started
      cvat_redis_ondisk:
        condition: service_started
      cvat_clickhouse:
        condition: service_started
