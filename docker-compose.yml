
services:
  cvat_db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cvat
      POSTGRES_DB: cvat
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - cvat_db:/var/lib/postgresql/data
    networks:
      - cvat

  cvat_redis_inmem:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - cvat_inmem_db:/data
    networks:
      - cvat

  cvat_redis_ondisk:
    image: apache/kvrocks:2.12.1
    restart: unless-stopped
    init: true
    volumes:
      - cvat_cache_db:/var/lib/kvrocks
    networks:
      - cvat

  cvat_clickhouse:
    image: clickhouse/clickhouse-server:23.11-alpine
    restart: unless-stopped
    volumes:
      - cvat_events_db:/var/lib/clickhouse
    networks:
      - cvat

  cvat_opa:
    image: openpolicyagent/opa:0.63.0
    restart: unless-stopped
    command:
      - run
      - --server
      - --log-level=error
      - --set=services.cvat.url=http://cvat-server:8080
    networks:
      - cvat

  cvat_server:
    image: cvat/server:${CVAT_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      - cvat_db
      - cvat_redis_inmem
      - cvat_redis_ondisk
      - cvat_clickhouse
      - cvat_opa
    environment:
      CVAT_POSTGRES_HOST: cvat_db
      CVAT_REDIS_INMEM_HOST: cvat_redis_inmem
      CVAT_REDIS_ONDISK_HOST: cvat_redis_ondisk
      CLICKHOUSE_HOST: cvat_clickhouse
      CLICKHOUSE_PORT: 8123

      ALLOWED_HOSTS: "*"
      CVAT_BASE_URL: https://cvat.localhost

      # === MinIO / S3 ===
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_ADDRESSING_STYLE: path

    command: init run server
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
    networks:
      - cvat
      - traefik
      - minio
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cvat-api.rule=Host(`cvat-api.localhost`)"
      - "traefik.http.services.cvat-api.loadbalancer.server.port=8080"
      - "traefik.http.routers.cvat-api.entrypoints=websecure"
      - "traefik.http.routers.cvat-api.tls.certresolver=le"

  cvat_ui:
    image: cvat/ui:${CVAT_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      - cvat_server
    networks:
      - cvat
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cvat-ui.rule=Host(`cvat.localhost`)"
      - "traefik.http.services.cvat-ui.loadbalancer.server.port=8000"
      - "traefik.http.routers.cvat-ui.entrypoints=websecure"
      - "traefik.http.routers.cvat-ui.tls.certresolver=le"

volumes:
  cvat_db:
  cvat_data:
  cvat_keys:
  cvat_logs:
  cvat_inmem_db:
  cvat_cache_db:
  cvat_events_db:

networks:
  cvat:
    external: true
  traefik:
    external: true
  minio:
    external: true
